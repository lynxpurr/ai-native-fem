name: branch-policy
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  source:
    name: branch-source (${{ github.event.pull_request.base.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The trusted workflow reads the event only. It never checks out PR code.
      - name: Verify source of the pull request
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          base = pr["base"]["ref"]
          head = pr["head"]["ref"]
          head_repository = pr["head"]["repo"]

          if base == "main":
              same_repository = (
                  head_repository is not None
                  and head_repository["id"] == pr["base"]["repo"]["id"]
              )
              allowed = same_repository and head == "develop"
              rule = "main accepts only this repository's develop branch."
          elif base == "develop":
              dependency_update = (
                  pr["user"]["login"] == "dependabot[bot]"
                  and head.startswith("dependabot/")
              )
              allowed = head.startswith("feature/") or dependency_update
              rule = "develop accepts feature/* branches and Dependabot updates."
          else:
              raise SystemExit("Unexpected protected branch.")

          print(rule)
          if not allowed:
              raise SystemExit(1)
          PY
