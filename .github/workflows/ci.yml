name: classical-research
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.python) || format('test (Windows {0})', matrix.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Build, verify and test both packages
        run: python .github/workflows/release-evidence.py build dist
      - name: Upload verified packages and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
