name: classical-research
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: windows-latest
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.python) || format('test (Windows {0})', matrix.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install ".[test]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          cp -R tests "$test_dir/tests"
          cp -R examples "$test_dir/examples"
          cd "$test_dir"
          python - <<'PY'
          import os
          from pathlib import Path
          import anf
          assert not Path(anf.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))
          PY
          python -m pytest -q tests
          python examples/beam.py
          python examples/plate_convergence.py
          python examples/plate_locking.py
