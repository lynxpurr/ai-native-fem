name: dependency-advisories
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install project dependencies and audit tooling
        run: |
          python -m pip install ".[test,mcp,sparse]" "pip-audit>=2.9,<3"
          python -m pip freeze --exclude ai-native-fem --exclude pip-audit > audit-requirements.txt
      - name: Query known dependency advisories
        run: python -m pip_audit -r audit-requirements.txt --no-deps --disable-pip
