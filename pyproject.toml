[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-fem"
version = "0.1.0a7"
description = "Small classical beam, plate and planar structure finite element models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]
mcp = ["mcp>=1.30,<2", "anyio>=4.16,<5"]
sparse = ["scipy>=1.17.1,<1.19"]

[project.scripts]
anf = "anf.cli:main"
anf-mcp = "anf.mcp_server:main"

[project.urls]
Repository = "https://github.com/lynxpurr/ai-native-fem"

[tool.setuptools.packages.find]
include = ["anf", "anf.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
